server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://app:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI 工作流可能需要较长时间。Nginx 默认 proxy_read_timeout 为 60 秒，
    # 会在后端仍在等待 Coze/DeepSeek 时提前返回 504。这里略大于后端 10 分钟超时。
    proxy_connect_timeout 30s;
    proxy_send_timeout 620s;
    proxy_read_timeout 620s;
    send_timeout 620s;
  }

  location /docs/ {
    proxy_pass http://app:3000/docs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://app:3000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
